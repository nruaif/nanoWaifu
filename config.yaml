training:
  batch_size: 64 # Reduced physical batch size
  grad_accum_steps: 1 # Effective batch size = 16 * 8 = 128
  learning_rate: 1.0e-4
  num_epochs: 100
  max_train_steps: 1000000
  gradient_checkpointing: true
  compile: false # Use torch.compile for faster training
  log_every_steps: 1

  save_image_every_steps: 2000
  image_size: 256
  num_workers: 8 # Set to 0 for Windows compatibility, increase on Linux
  class_dropout_prob: 0.1
  cfg_scale: 1.4
  output_dir: "outputs"
  wandb_project: "nanoWaifu-C2I"
  resume_from: "outputs2/"
  max_checkpoints: 3

model:
  use_v2_model: true
  use_vae: true # Use Flux2TinyAutoEncoder
  fcdm_dim: 512
  fcdm_depth: 3
  in_channels: 3 # RGB (overwritten to 32 if use_vae is true)
  patch_size: 1 # PixelUnshuffle factor

data:
  webdataset_url: 'train/00{001..006}.tar'
  use_advanced_captions: true  # Enable advanced caption processing with tag dropping
