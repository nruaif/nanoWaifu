training:
  batch_size: 32
  learning_rate: 3.0e-4
  warmup_steps: 5000
  num_epochs: 100
  max_train_steps: 1000000
  gradient_checkpointing: true
  freeze_backbone: false
  log_every_steps: 10

  save_image_every_steps: 5000
  image_size: 256  # Small for testing/raw pixel speed
  patch_size: 16   # Small patch size since image is small (64/4 = 16 patches per side)
  num_workers: 4
  class_dropout_prob: 0.1
  cfg_scale: 4.0
  output_dir: "outputs"
  wandb_project: "nanoWaifu-ae"
  resume_from: "" # Path to checkpoint to resume from (e.g. "outputs/ckpt_step_5000.pth")
  max_checkpoints: 3 # Keep only top N latest checkpoints

  # Ternary quantization temperature annealing
  initial_temp: 1.0         # Starting quantization temperature
  temp_anneal_factor: 0.98  # Temperature decay per epoch boundary
  temp_anneal_min: 0.95     # Minimum temperature clamp

  # MAE-style masking (set to true to enable)
  use_masking: false
  residual_dropout: 0.1  # Probability of dropping continuous latent channels per sample

model:
  hidden_dims: [64, 128, 256, 512, 512] # f32 downsampling
  expand_ratio: 3
  num_transformer_blocks: 8
  in_channels: 3
  dim: 256
  latent_continuous: 32  # Continuous bypass channels (gradient highway)

data:
  webdataset_url: "/data/train/000{01..40}.tar" # Example URL
  csv_path: "characters.csv"
