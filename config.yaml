training:
  batch_size: 128
  grad_accum_steps: 1
  learning_rate: 8.0e-4
  num_epochs: 100
  max_train_steps: 2000000
  gradient_checkpointing: false
  compile: false
  log_every_steps: 10

  save_image_every_steps: 5000
  image_size: 256
  num_workers: 8
  class_dropout_prob: 0.1
  cfg_scale: 1.4
  output_dir: "outputs_dit"
  wandb_project: "nanoWaifu-C2I"
  resume_from: "outputs_dit/"
  max_checkpoints: 3

model:
  type: "mar"      # Use TokenformerDiT
  use_vae: true    # Recommended for 256x256
  use_tiny_vae: true
  fcdm_dim: 768    # Hidden dimension (Transformer)
  fcdm_depth: 12   # Number of layers
  num_heads: 12    # Number of attention heads
  in_channels: 3   # RGB (overwritten to 32 by VAE)
  patch_size: 1    # Factor for initial projection

data:
  webdataset_url: 'train/train/00{001..060}.tar'
  use_advanced_captions: true
