training:
  batch_size: 64
  learning_rate: 2.0e-4
  warmup_steps: 1000
  num_epochs: 100
  max_train_steps: 1000000
  log_every_steps: 10

  save_image_every_steps: 5000
  image_size: 256
  num_workers: 4
  output_dir: "outputs"
  wandb_project: "nanoWaifu-ae"
  resume_from: "outputs/ckpt_step_80000.pth"
  max_checkpoints: 3

  # Binary quantization temperature annealing
  temp_anneal_factor: 0.98
  temp_anneal_min: 0.95


  # Sequential block masking: drops contiguous blocks of tokens from the right
  use_masking: true
  mask_block_size: 14   # Number of tokens per block; blocks masked left-to-right

model:
  dims: [96, 192, 384]
  depths: [3, 3, 9]
  latent_discrete: 224  # 14 * 16
  num_transformer_blocks: 12
  num_cls_tokens: 8

data:
  webdataset_url: "/data/train/000{01..40}.tar"
  csv_path: "characters.csv"
