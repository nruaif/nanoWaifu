training:
  batch_size: 64
  learning_rate: 2.0e-4
  warmup_steps: 1000
  num_epochs: 100
  max_train_steps: 1000000
  log_every_steps: 10

  save_image_every_steps: 5000
  image_size: 256
  num_workers: 4
  output_dir: "outputs"
  wandb_project: "nanoWaifu-ae"
  resume_from: "outputs/ckpt_step_80000.pth"
  max_checkpoints: 3

  # Perceptual loss weight
  perceptual_weight: 1.0

model:
  patch_size: 8
  dim: 768
  enc_depth: 12
  dec_depth: 12
  latent_dim: 128
  num_heads: 12

gan:
  enabled: false
  ndf: 64
  n_layers: 3
  num_scales: 2
  disc_lr: 1.0e-4
  disc_warmup_steps: 0
  adv_weight: 0.1
  r1_gamma: 10.0
  r1_every: 16

data:
  webdataset_url: "/data/train/000{01..40}.tar"
  csv_path: "characters.csv"
