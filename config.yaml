training:
  batch_size: 32
  grad_accum_steps: 1
  learning_rate: 1.0e-4
  max_train_steps: 2000000
  gradient_checkpointing: false

  # Training objective:
  #   flow_matching - multi-step FM (default)
  #   emf           - Euler Mean Flows, one-step / few-step generation (emf.py)
  objective: emf

  # EMF settings (used when objective: emf)
  emf:
    delta_t: 0.05          # local linearization step size
    interval_ratio: 0.25   # fraction of samples with r != t
    time_sampler: uniform  # or logit_normal
    cfg_scale: 2.5         # effective guidance baked into the model (0 = off)
    cfg_k: 0.4             # CFG mixing coefficient
    adaptive_c: 0.001      # adaptive loss constants (MeanFlow / ECM style)
    adaptive_p: 1.0
    val_steps: 8           # sampling steps for validation images

  compile: false
  compile_vae: false
  log_every_steps: 10

  save_image_every_steps: 5000
  image_size: 256
  num_workers: 4
  class_dropout_prob: 0.1
  cfg_scale: 6
  output_dir: "outputs_fcdm"      # <-- changed so you don't mix DiT / FCDM checkpoints
  wandb_project: "nanoWaifu-C2I"
  resume_from: "outputs_fcdm/"   # <-- changed
  max_checkpoints: 16

  # Augmentations
  noise_inject_ratio: 0
  cross_ratio: 0

  # Loss
  loss_type: "mse"
  deltafm_lambda: 0
  infonce_weight: 0

  # Timestep sampling
  timestep_sampler: "uniform"

  # EMA
  use_ema: true
  ema_decay: 0.9999

  # LR scheduling
  use_lr_scheduler: false
  warmup_steps: 10000
  min_lr_ratio: 0.1

  # Gradient clipping
  max_grad_norm: 1.0

  # HF Hub
  push_to_hf: true
  hf_repo_id: "Shio-Koube/ConvNext-Diff"

model:
  # FCDM only needs two scaling knobs:
  #   dim   = base hidden channels C
  #   depth = number of blocks L in the first (full-resolution) stage
  #
  # Paper reference:
  #   FCDM-S : dim=128, depth=2  (~33M params, 3.1 GFLOPs)
  #   FCDM-B : dim=256, depth=2  (~128M params, 12.2 GFLOPs)
  #   FCDM-L : dim=512, depth=2  (~505M params, 48.3 GFLOPs)
  #   FCDM-XL: dim=512, depth=3  (~699M params, 64.6 GFLOPs)
  dim: 256
  depth: 3

  # Attention after every N blocks in the decoder stages (0 = off)
  attn_every: 3

  # LFQ Memory Block at final stage (decoder_level_1) after 2nd block — legacy (Linear K->c_mem)
  # Disabled by default. Enable with use_lfq_memory: true
  use_lfq_memory: false
  lfq_c_mem: 512
  lfq_num_latents: 8
  lfq_k_bits: 12

  # Top-K Memory Block at final stage (decoder_level_1) after 2nd block — current (sparse)
  # Replaces LFQ's 2^K tables with learned keys/values + top-k routing.
  # Uses nn.Linear for q_proj + nn.Parameter keys/values, fully differentiable via softmax(top-k).
  # Placed after 2nd ConvNeXt in decoder_level_1 (full-resolution, c_in=dim)
  use_topk_memory: true
  topk_c_mem: 512
  topk_num_entries: 262144
  topk_top_k: 8
  topk_query_dim: 64

  # VAE settings (model consumes the native f/8 latent, 32 channels)
  use_vae: true
  use_tiny_vae: false

  # Legacy DiT keys — harmless, but ignored by FCDM (only used on the no-VAE path)
  patch_size: 1
  in_channels: 3

data:
  use_cached_latents: false
  webdataset_url: "/workspace/data/train/000{00..99}.tar"
  use_advanced_captions: true
