model:
  embed_dim: 1024
  depth: 12
  num_heads: 16
  num_classes: 12476
  patch_size: 16
  proj_dim: 1024 

training:
  image_size: 256
  batch_size: 32 
  learning_rate: 5.0e-5 # Stable starting LR for small batch
  weight_decay: 0.05
  max_train_steps: 600000
  compile: true
  grad_clip: 1.0
  ema_beta: 0.99
  log_every_steps: 100
  save_ckpt_every_steps: 1000
  save_image_every_steps: 1000 
  class_dropout_prob: 0.1 
  num_workers: 4
  output_dir: "outputs"
  wandb_project: "EPG-nanoWaifu"

data:
  webdataset_url: "train/{00001..00006}.tar"

stage1_ckpt: "outputs/epg_stage1_step_600000.pth"
