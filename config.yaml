training:
  batch_size: 64
  grad_accum_steps: 1
  learning_rate: 8.0e-4
  num_epochs: 100
  max_train_steps: 2000000
  gradient_checkpointing: false
  compile: false
  log_every_steps: 10

  save_image_every_steps: 5000
  image_size: 256
  num_workers: 4
  class_dropout_prob: 0.1
  cfg_scale: 4
  output_dir: "outputs_dit"
  wandb_project: "nanoWaifu-C2I"
  resume_from: "outputs_dit/"
  max_checkpoints: 3
  noise_inject_ratio: 0
  cross_ratio: 0
  sampler_type: "euler"

model:
  type: "dit"
  use_vae: false
  use_tiny_vae: false
  fcdm_dim: 768
  fcdm_depth: 16
  num_heads: 12
  in_channels: 3
  encoder_depth: 2
  decoder_depth: 2
  unet_base_dim: 64
  lambda_nll: 0.01
  lambda_repa: 0.5
  repa_dino_dim: 1024
  patch_size: 16

data:
  webdataset_url: '/workspace/data/train/00{001..030}.tar'
  use_advanced_captions: true
