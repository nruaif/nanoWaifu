training:
  batch_size: 128
  grad_accum_steps: 1
  learning_rate: 1.0e-4
  num_epochs: 100
  max_train_steps: 2000000
  gradient_checkpointing: false
  compile: false
  log_every_steps: 10

  save_image_every_steps: 5000
  image_size: 256
  num_workers: 4
  class_dropout_prob: 0.1
  cfg_scale: 4
  output_dir: "outputs_dit"
  wandb_project: "nanoWaifu-C2I"
  resume_from: "outputs_dit/"
  max_checkpoints: 3
  sampler_type: "euler"  # 'euler' or 'lookahead'

  # Patch Forcing: LTG timestep sampler
  ltg_loc: 0.0
  ltg_scale: 1.0
  ltg_std: 0.5
  lambda_uncertainty: 0.01

model:
  type: "dit"
  use_vae: false
  use_tiny_vae: false
  fcdm_dim: 1024
  fcdm_depth: 16
  num_heads: 16
  in_channels: 3
  lambda_nll: 0.01
  patch_size: 16
  use_deco_decoder: true

data:
  webdataset_url: '/workspace/data/train/00{001..080}.tar'
  use_advanced_captions: true
