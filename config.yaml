training:
  batch_size: 16 # Reduced physical batch size
  grad_accum_steps: 8 # Effective batch size = 16 * 8 = 128
  learning_rate: 1.0e-4
  num_epochs: 100
  max_train_steps: 1000000
  gradient_checkpointing: true
  log_every_steps: 10

  save_image_every_steps: 2000
  gradient_checkpointing: true
  image_size: 256
  num_workers: 4 # Set to 0 for Windows compatibility, increase on Linux
  class_dropout_prob: 0.1
  cfg_scale: 1.4
  output_dir: "outputs"
  wandb_project: "nanoWaifu-C2I"
  resume_from: "outputs/"
  max_checkpoints: 3

model:
  use_v2_model: true
  fcdm_dim: 512
  fcdm_depth: 3
  in_channels: 3 # RGB
  patch_size: 8 # PixelUnshuffle factor

data:
  webdataset_url: '/root/data/train/00{001..019}.tar'
  use_advanced_captions: true  # Enable advanced caption processing with tag dropping
