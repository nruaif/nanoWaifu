training:
  batch_size: 16
  learning_rate: 1.0e-4
  num_epochs: 100
  max_train_steps: 1000000
  gradient_checkpointing: true
  log_every_steps: 10

  save_image_every_steps: 5000
  image_size: 256
  num_workers: 4 # Set to 0 for Windows compatibility, increase on Linux
  class_dropout_prob: 0.1
  cfg_scale: 1.4
  output_dir: "outputs"
  wandb_project: "nanoWaifu-T2I"
  resume_from: "outputs/"
  max_checkpoints: 3

model:
  fcdm_dim: 384
  fcdm_depth: 2
  in_channels: 3 # RGB
  patch_size: 8 # PixelUnshuffle factor

data:
  webdataset_url: 'https://huggingface.co/datasets/Shio-Koube/150k-anime/resolve/main/train/00{001..006}.tar'
  use_advanced_captions: true  # Enable advanced caption processing with tag dropping
