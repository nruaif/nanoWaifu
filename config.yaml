training:
  batch_size: 64
  grad_accum_steps: 1
  learning_rate: 8.0e-4
  num_epochs: 100
  max_train_steps: 2000000
  gradient_checkpointing: false
  compile: false
  log_every_steps: 10

  save_image_every_steps: 5000
  image_size: 256
  num_workers: 4
  class_dropout_prob: 0
  cfg_scale: 4
  output_dir: "outputs_dit"
  wandb_project: "nanoWaifu-C2I"
  resume_from: "outputs_dit/"
  max_checkpoints: 3
  noise_inject_ratio: 0.1
  cross_ratio: 0.1

model:
  type: "dit"      # Use TokenformerDiT
  use_vae: true    # Recommended for 256x256
  use_tiny_vae: false
  fcdm_dim: 768    # Hidden dimension (Transformer)
  fcdm_depth: 12   # Number of layers
  num_heads: 12    # Number of attention heads
  in_channels: 3   # RGB (overwritten to 32 by VAE)
  patch_size: 1    # Factor for initial projection
  drop_ratio: 0.75 # Token drop ratio (0.0 to 1.0)
  path_drop_prob: 0.1 # Probability of dropping the middle layers (0.0 to 1.0)
  uniformity_weight: 0.01 # Weight for the uniformity loss

data:
  webdataset_url: '/root/data/train/00{049..080}.tar'
  use_advanced_captions: true
