training:
  batch_size: 128
  grad_accum_steps: 1
  learning_rate: 1.0e-4
  num_epochs: 100
  max_train_steps: 2000000
  gradient_checkpointing: false
  compile: false
  log_every_steps: 10

  save_image_every_steps: 5000
  image_size: 256
  num_workers: 4
  class_dropout_prob: 0.1
  cfg_scale: 4
  sprint_path_drop_prob: 0.1
  output_dir: "outputs_dit"
  wandb_project: "nanoWaifu-C2I"
  resume_from: "outputs_dit/"
  max_checkpoints: 3
  
  patch_forcing: true
  ltg_m: 0.0
  ltg_s: 1.0
  ltg_sigma: 0.25
  sampler_type: "look-ahead"
  sampler_percentile: 0.4
  sampler_alpha: 1.5
  sampler_inner_steps: 10

model:
  type: "dit"
  use_vae: false
  use_tiny_vae: false
  fcdm_dim: 1024
  fcdm_depth: 24
  num_heads: 16
  in_channels: 3
  lambda_nll: 0.01
  patch_size: 16
  sprint_route_ratio: 0.75
  use_deco_decoder: true

data:
  webdataset_url: '/workspace/data/train/00{01..080}.tar'
  use_advanced_captions: true
