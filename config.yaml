training:
  batch_size: 64
  grad_accum_steps: 1
  learning_rate: 1.0e-4
  num_epochs: 100              # Not used; max_train_steps takes precedence
  max_train_steps: 2000000
  gradient_checkpointing: false
  compile: false
  compile_vae: false
  log_every_steps: 10

  save_image_every_steps: 5000
  image_size: 256
  num_workers: 4
  class_dropout_prob: 0.1
  cfg_scale: 6
  output_dir: "outputs_fcdm"      # <-- changed so you don't mix DiT / FCDM checkpoints
  wandb_project: "nanoWaifu-C2I"
  resume_from: "outputs_fcdm/"   # <-- changed
  max_checkpoints: 16

  # Augmentations
  noise_inject_ratio: 0
  cross_ratio: 0

  # Loss
  loss_type: "mse"
  deltafm_lambda: 0.05
  infonce_weight: 0

  # Timestep sampling
  timestep_sampler: "uniform"

  # EMA
  use_ema: true
  ema_decay: 0.9999

  # LR scheduling
  use_lr_scheduler: false
  warmup_steps: 10000
  min_lr_ratio: 0.1

  # Gradient clipping
  max_grad_norm: 1.0

  # HF Hub
  push_to_hf: true
  hf_repo_id: "Shio-Koube/ConvNext-Diff"

model:
  # FCDM only needs two scaling knobs:
  #   dim   = base hidden channels C
  #   depth = number of blocks L in the first (full-resolution) stage
  #
  # Paper reference:
  #   FCDM-S : dim=128, depth=2  (~33M params, 3.1 GFLOPs)
  #   FCDM-B : dim=256, depth=2  (~128M params, 12.2 GFLOPs)
  #   FCDM-L : dim=512, depth=2  (~505M params, 48.3 GFLOPs)
  #   FCDM-XL: dim=512, depth=3  (~699M params, 64.6 GFLOPs)
  dim: 256
  depth: 2

  # VAE settings
  use_vae: true
  use_tiny_vae: false

  # Conditioning (small FCDM blocks run over the tag grid)
  fcdm_blocks: 2

  # Legacy DiT keys — harmless, but ignored by FCDM
  num_heads: 16
  patch_size: 1
  in_channels: 3

data:
  cache_dir: '/workspace/nanoWaifu/cached_latents/latents-000{00..66}.tar'
  use_cached_latents: true
  use_advanced_captions: true