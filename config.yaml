training:
  batch_size: 128
  grad_accum_steps: 1
  learning_rate: 1.0e-4
  num_epochs: 100
  max_train_steps: 2000000
  gradient_checkpointing: false
  compile: false
  log_every_steps: 10
  save_image_every_steps: 5000
  image_size: 256
  num_workers: 4
  class_dropout_prob: 0.1
  cfg_scale: 2.0
  output_dir: "outputs_dit"
  wandb_project: "nanoWaifu-MiniT2I"
  resume_from: "outputs_dit/"
  max_checkpoints: 16

data:
  cache_dir: '/root/data/train/000{01..99}.tar'
  use_cached_latents: true
  use_advanced_captions: true
