training:
  batch_size: 32
  learning_rate: 3.0e-4
  warmup_steps: 5000
  num_epochs: 100
  max_train_steps: 1000000
  gradient_checkpointing: true
  freeze_backbone: false
  log_every_steps: 10

  save_image_every_steps: 5000
  image_size: 256  # Small for testing/raw pixel speed
  patch_size: 16   # Small patch size since image is small (64/4 = 16 patches per side)
  num_workers: 2
  class_dropout_prob: 0.1
  cfg_scale: 4.0
  output_dir: "outputs"
  wandb_project: "nanoWaifu-ae"
  resume_from: "outputs/ckpt_step_5000.pth" # Path to checkpoint to resume from (e.g. "outputs/ckpt_step_1000.pth"), empty for new run
  max_checkpoints: 3 # Keep only top N latest checkpoints

model:
  hidden_dims: [64, 128, 256, 512, 512] # f32 downsampling
  expand_ratio: 3
  num_transformer_blocks: 8
  in_channels: 3
  dim: 256

data:
  webdataset_url: "/data/train/000{40..80}.tar" # Example URL
  csv_path: "characters.csv"

