training:
  batch_size: 128
  learning_rate: 3.0e-4
  num_epochs: 100
  max_train_steps: 1000000
  log_every_steps: 10

  save_every_steps: 1000  # Renamed from save_image_every_steps
  image_size: 224  # Raw image size (matching coatnext_nano_rw_224)
  num_workers: 4
  l1_weight: 1.0e-4
  lejepa_lambda: 0.02
  output_dir: "outputs"
  wandb_project: "nanoWaifu-SSL"
  resume_from: "" # Path to checkpoint to resume from
  max_checkpoints: 3

model:
  proj_dim: 8192
  backbone_model: "coatnext_nano_rw_224.sw_in1k"

data:
  webdataset_url: "/workspace/shinon/t2i/nanoWaifu/anime/train/000{01..47}.tar"
  tags_path: "tags.txt"
