training:
  batch_size: 64
  grad_accum_steps: 1
  learning_rate: 1.0e-4
  num_epochs: 100              # Not used; max_train_steps takes precedence
  max_train_steps: 2000000
  gradient_checkpointing: false
  compile: false
  compile_vae: false
  log_every_steps: 10

  save_image_every_steps: 5000
  image_size: 256
  num_workers: 4
  class_dropout_prob: 0.1
  cfg_scale: 6               # Used for validation sampling
  output_dir: "outputs_dit"
  wandb_project: "nanoWaifu-C2I"
  resume_from: "outputs_dit/"
  max_checkpoints: 16

  # Augmentations
  noise_inject_ratio: 0
  cross_ratio: 0

  # Loss
  loss_type: "mse"           # mse | l1 | huber
  deltafm_lambda: 0.05
  infonce_weight: 0.2

  # Timestep sampling
  timestep_sampler: "uniform"  # uniform | logit_normal | cosine

  # EMA
  use_ema: true
  ema_decay: 0.9999

  # LR scheduling
  use_lr_scheduler: false
  warmup_steps: 10000
  min_lr_ratio: 0.1

  # Gradient clipping
  max_grad_norm: 1.0

  # HF Hub
  push_to_hf: true
  hf_repo_id: "Shio-Koube/ConvNext-Diff"

model:
  type: "dit"
  use_vae: true
  use_tiny_vae: false
  dim: 1024
  depth: 16
  num_heads: 16
  in_channels: 3
  patch_size: 1

  # FCDM conditioning
  fcdm_blocks: 2

data:
  cache_dir: '/workspace/nanoWaifu/cached_latents/latents-000{00..66}.tar'
  use_cached_latents: true
  use_advanced_captions: true
