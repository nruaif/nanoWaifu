model:
  embed_dim: 1024
  depth: 12
  num_heads: 16
  num_classes: 12476
  patch_size: 16
  proj_dim: 1024 # SigLIP projection dimension

training:
  image_size: 256
  batch_size: 32 # Per-GPU batch size
  learning_rate: 6.0e-3 # Stage 1 LR (scaled to batch size in paper)
  weight_decay: 0.05
  max_train_steps: 600000
  compile: true
  ema_beta: 0.99
  log_every_steps: 100
  save_ckpt_every_steps: 5000
  save_image_every_steps: 5000 # For Stage 2 validation
  class_dropout_prob: 0.1 # For Stage 2 CFG
  num_workers: 4
  output_dir: "outputs"
  wandb_project: "EPG-nanoWaifu"

data:
  # Shards downloaded by setup.py
  webdataset_url: "train/{00001..00006}.tar"

# Stage 2 specific: Path to Stage 1 checkpoint
stage1_ckpt: "outputs/epg_stage1_step_600000.pth"
