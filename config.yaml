training:
  batch_size: 128
  grad_accum_steps: 1
  learning_rate: 8.0e-4
  num_epochs: 100
  max_train_steps: 2000000
  gradient_checkpointing: false
  compile: false
  log_every_steps: 10

  save_image_every_steps: 5000
  image_size: 256
  num_workers: 4
  class_dropout_prob: 0.1
  cfg_scale: 4
  output_dir: "outputs_dit"
  wandb_project: "nanoWaifu-C2I"
  resume_from: "outputs_dit/"
  max_checkpoints: 3
  sampler_type: "euler"

model:
  type: "dit"
  use_vae: false
  use_tiny_vae: false
  fcdm_dim: 768
  fcdm_depth: 16
  num_heads: 12
  in_channels: 3
  lambda_nll: 0.01
  patch_size: 16
  use_deco_decoder: true

data:
  webdataset_url: '/root/nanoWaifu/data/train/00{041..080}.tar'
  use_advanced_captions: true
