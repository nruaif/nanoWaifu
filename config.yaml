training:
  batch_size: 64
  learning_rate: 2.0e-4
  warmup_steps: 1000
  num_epochs: 100
  max_train_steps: 1000000
  log_every_steps: 10

  save_image_every_steps: 5000
  image_size: 256
  num_workers: 4
  output_dir: "outputs"
  wandb_project: "nanoWaifu-ae"
  resume_from: "outputs/ckpt_step_80000.pth"
  max_checkpoints: 3

  # Ternary quantization temperature annealing
  temp_anneal_factor: 0.98
  temp_anneal_min: 0.95

  # Continuous latent residual dropout
  residual_dropout: 0.1

  # MAE-style masking (applied to half the batch after bottleneck)
  use_masking: true
  mask_ratio: 0.75      # Fraction of spatial tokens to mask
  mask_patch: 2          # Block size for masking

model:
  dims: [96, 192, 384, 768]
  depths: [3, 3, 9, 3]
  latent_discrete: 256
  latent_continuous: 32
  num_transformer_blocks: 12
  num_cls_tokens: 4

data:
  webdataset_url: "/data/train/000{01..40}.tar"
  csv_path: "characters.csv"
